apiVersion: v1
kind: Pod
metadata:
  name: volcano-vgpu-resource-only-test
spec:
  runtimeClassName: nvidia
  schedulerName: volcano
  nodeSelector:
    kubernetes.io/hostname: t3dgq
  restartPolicy: Never
  containers:
    - name: hold-resource
      image: nvcr.io/nvidia/cuda:12.2.0-base-ubuntu22.04
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc"]
      args:
        - |
          echo "vgpu resource allocated; no GPU workload is executed"
          sleep 3600
      resources:
        limits:
          volcano.sh/vgpu-number: 1
          volcano.sh/vgpu-memory: 4096
          volcano.sh/vgpu-cores: 10
