apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: volcano-vgpu-4pod-2vgpu-resource-only
spec:
  schedulerName: volcano
  minAvailable: 4
  tasks:
    - name: worker
      replicas: 4
      template:
        spec:
          runtimeClassName: nvidia
          schedulerName: volcano
          nodeSelector:
            kubernetes.io/hostname: t3dgq
          restartPolicy: Never
          containers:
            - name: hold-resource
              image: nvcr.io/nvidia/cuda:12.2.0-base-ubuntu22.04
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "-lc"]
              args:
                - |
                  echo "2-vGPU resource allocated; no GPU workload is executed"
                  sleep 3600
              resources:
                limits:
                  volcano.sh/vgpu-number: 2
                  volcano.sh/vgpu-memory: 8192
                  volcano.sh/vgpu-cores: 25
