syntax = "proto3";

package dqn_scheduler;

option go_package = "volcano.sh/volcano/pkg/scheduler/api/devices/nvidia/vgpu/dqngrpc;dqngrpc";

service DQNScheduler {
  rpc Predict(PredictRequest) returns (PredictResponse);
}

message GPUState {
  int32 index = 1;
  string uuid = 2;

  uint32 total_mem = 3;
  uint32 used_mem = 4;

  uint32 used_core = 5;
  uint32 used_num = 6;

  uint32 number = 7;
  string device_type = 8;
}

message PredictRequest {
  string node_name = 1;
  string pod_namespace = 2;
  string pod_name = 3;

  uint32 mem_req = 4;
  uint32 core_req = 5;
  int32 nums = 6;

  repeated GPUState gpus = 7;
}

message GPUScore {
  int32 index = 1;
  double score = 2;
  bool fit = 3;
}

message PredictResponse {
  repeated int32 ordered_indexes = 1;
  int32 selected_index = 2;
  repeated GPUScore scores = 3;

  bool fallback = 4;
  string reason = 5;
}
