apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: cmp-balanced-job-8x1-spread
spec:
  schedulerName: volcano
  minAvailable: 8
  tasks:
    - name: worker
      replicas: 8
      template:
        metadata:
          labels:
            experiment: cmp-vcjob
        spec:
          runtimeClassName: nvidia
          schedulerName: volcano
          nodeSelector:
            kubernetes.io/hostname: t3dgq
          restartPolicy: Never
          containers:
            - name: hold-resource
              image: nvcr.io/nvidia/cuda:12.2.0-base-ubuntu22.04
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "-lc"]
              args:
                - |
                  echo "resource allocated; no GPU workload is executed"
                  sleep 600
              resources:
                limits:
                  volcano.sh/vgpu-number: 1
                  volcano.sh/vgpu-memory: 4096
                  volcano.sh/vgpu-cores: 10
