apiVersion: v1
kind: Pod
metadata:
  name: dqn-success-preload-a
  labels:
    experiment: dqn-success
    role: preload
  annotations:
    volcano.sh/bind-phase: "success"
    volcano.sh/vgpu-node: "t3dgq"
    volcano.sh/devices-to-allocate: "GPU-7b94f673-ce00-719b-2c94-706baa032dae,NVIDIA,12000,10:"
    volcano.sh/vgpu-ids-new: "GPU-7b94f673-ce00-719b-2c94-706baa032dae,NVIDIA,12000,10:"
spec:
  runtimeClassName: nvidia
  nodeName: t3dgq
  restartPolicy: Never
  containers:
  - name: hold
    image: nvcr.io/nvidia/cuda:12.2.0-base-ubuntu22.04
    imagePullPolicy: IfNotPresent
    command: ["/bin/bash", "-lc"]
    args: ["echo preload; sleep 600"]
    resources:
      limits:
        volcano.sh/vgpu-number: 1
        volcano.sh/vgpu-memory: 12000
        volcano.sh/vgpu-cores: 10
---
