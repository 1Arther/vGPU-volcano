apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: dqn-success-job
spec:
  schedulerName: volcano
  minAvailable: 4
  tasks:
  - name: pair
    replicas: 2
    template:
      metadata:
        labels:
          experiment: dqn-success
          role: target
      spec:
        runtimeClassName: nvidia
        schedulerName: volcano
        nodeSelector:
          kubernetes.io/hostname: t3dgq
        restartPolicy: Never
        containers:
        - name: hold
          image: nvcr.io/nvidia/cuda:12.2.0-base-ubuntu22.04
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args: ["echo pair; sleep 600"]
          resources:
            limits:
              volcano.sh/vgpu-number: 2
              volcano.sh/vgpu-memory: 4000
              volcano.sh/vgpu-cores: 15
  - name: mem
    replicas: 1
    template:
      metadata:
        labels:
          experiment: dqn-success
          role: target
      spec:
        runtimeClassName: nvidia
        schedulerName: volcano
        nodeSelector:
          kubernetes.io/hostname: t3dgq
        restartPolicy: Never
        containers:
        - name: hold
          image: nvcr.io/nvidia/cuda:12.2.0-base-ubuntu22.04
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args: ["echo mem; sleep 600"]
          resources:
            limits:
              volcano.sh/vgpu-number: 1
              volcano.sh/vgpu-memory: 8000
              volcano.sh/vgpu-cores: 10
  - name: core
    replicas: 1
    template:
      metadata:
        labels:
          experiment: dqn-success
          role: target
      spec:
        runtimeClassName: nvidia
        schedulerName: volcano
        nodeSelector:
          kubernetes.io/hostname: t3dgq
        restartPolicy: Never
        containers:
        - name: hold
          image: nvcr.io/nvidia/cuda:12.2.0-base-ubuntu22.04
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args: ["echo core; sleep 600"]
          resources:
            limits:
              volcano.sh/vgpu-number: 1
              volcano.sh/vgpu-memory: 4000
              volcano.sh/vgpu-cores: 35
